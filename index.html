<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="promo">
      <img class="promo__image" src="./eisenhower-matrix.jpg" alt="The Eisenhower Matrix for task prioritization." width="300" height="200">
      <a class="promo__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>

    <main class="todo-app">
      <section class="add-task">
        <label class="add-task__label" for="new-task">Add Item</label>
        <div class="add-task__form">
          <input id="new-task" class="add-task__input" type="text">
          <button class="add-task__button">Add</button>
        </div>
      </section>

      <section class="tasks">
        <h3 class="tasks__title">Todo</h3>
        <ul id="incomplete-tasks" class="tasks__list">
          <li class="task-item">
            <input class="task-item__checkbox" type="checkbox">
            <label class="task-item__label">Pay Bills</label>
            <input type="text" class="task-item__input">
            <button class="task-item__button task-item__button--edit">Edit</button>
            <button class="task-item__button task-item__button--delete">
              <img class="task-item__delete-icon" src="./remove.svg" alt="Matrix" width="20" height="20">
            </button>
          </li>
          <li class="task-item task-item--editing">
            <input class="task-item__checkbox" type="checkbox">
            <label class="task-item__label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task-item__input">
            <button class="task-item__button task-item__button--edit">Save</button>
            <button class="task-item__button task-item__button--delete">
              <img class="task-item__delete-icon" src="./remove.svg" alt="" width="20" height="20">
            </button>
          </li>
        </ul>
      </section>

      <section class="tasks">
        <h3 class="tasks__title">Completed</h3>
        <ul id="completed-tasks" class="tasks__list tasks__list--completed">
          <li class="task-item">
            <input class="task-item__checkbox" type="checkbox" checked>
            <label class="task-item__label">See the Doctor</label>
            <input type="text" class="task-item__input">
            <button class="task-item__button task-item__button--edit">Edit</button>
            <button class="task-item__button task-item__button--delete">
              <img class="task-item__delete-icon" src="./remove.svg" alt="" width="20" height="20">
            </button>
          </li>
        </ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
