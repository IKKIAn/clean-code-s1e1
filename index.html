<!DOCTYPE html>
<html>
<head><title>Todo App</title>
<link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aaa"><img src="./eisenhower-matrix.jpg" alt="The Eisenhower Matrix" width="300" height="200"><a class="more_inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a></div>
<main class="todo-app">
<section class="add-task"><div class="centered-main-page-element"><p id="topSectionForAddingElementToList"><label class="task-item__label">Add Item</label><div class="task-row-wrapper"><input id="new-task" class="add-task__input" type="text"><button>Add</button></div></section>
</p><section class="tasks"><h3>Todo</h3>
<ul id="incomplete-tasks" class="tasks__list">
<li><input type="checkbox"><label class="task-item__label">Pay Bills</label><input type="text" class="task-item__input"><button class="task-item__button task-item__button--edit">Edit</button><button class="task-item__button task-item__button--delete">
<img class="task-item__delete-icon" src="./remove.svg" alt="Matrix" width="20" height="20">
</button></li>
<li class="task-item task-item--editing"><input type="checkbox"><label class="task-item__label">Go Shopping</label><input type="text" value="Go Shopping" class="task-item__input"><button class="task-item__button task-item__button--edit">Save</button><button class="task-item__button task-item__button--delete">
<img class="task-item__delete-icon" src="./remove.svg" alt="Matrix" width="20" height="20">
</button></li>
</ul></section><section class="tasks"></section><h3>Completed</h3><ul id="completed-tasks" class="tasks__list tasks__list--completed"><li><input type="checkbox" checked><label class="task-item__label">See the Doctor</label><input type="text" class="task-item__input"><button class="task-item__button task-item__button--edit">Edit</button><button class="task-item__button task-item__button--delete">
<img class="task-item__delete-icon" src="./remove.svg" alt="Matrix" width="20" height="20">
</button>
</li>
</ul>
</div>
</section>
</main>

<script src="app.js"></script>
</body>
</html>
